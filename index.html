<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=], initial-scale=1.0">
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
    <link rel="stylesheet" href="style.css">
    <title>Working with Numbers
    </title>
</head>
<body>
    <form>
        <div class="container rounded mt-5 p-3" style="background-color: rgb(88, 127, 232); color: whitesmoke; font-size:25px;">
            <dl><p style=" color:black;">Working With Numbers!</p></dl>
            <input type="number" id="num1" placeholder="Number1"><br>
            <input type="number" id="num2" placeholder="Number2"><br>
            <input type="button" py-click="addingnums" value="Add">
            <input type="button" py-click="subingnums" value="Subtract">
            <input type="button" py-click="multiplicationnums" value="Multiplication">
            <input type="button" py-click="Exponums" value="Exponentiation">
            <input type="button" py-click="floatdivnums" value="Division">
            <input type="button" py-click="floordivnums" value="Floor division">
            <input type="button" py-click="modulonums" value="Modulo"><br><br>
                <div id="result" style="background-color: rgb(239, 223, 119); color: rgb(0, 0, 0); font-size:30px;"></div>
        </div>  
        
    </form>
  
    <py-script src="main.py"></py-script> 
</body>
</html>
